decisions:
  - id: DEC-001
    date: 2026-09-19
    owner: pm
    summary: 검사 범위를 구조 lint와 broken link로 한정한다.
    context: >
      vaultos-health.md §2는 Health 검사 항목 9개를 정의하지만, 그중 Orphan Requirements /
      Unlinked ADR / Open CR / Unverified Features는 프로젝트가 실제로 쌓여야 검사 대상이 생긴다.
      현재 프로젝트는 1개뿐이다.
    consequence: >
      이번 릴리스는 REQ-LINT-001~003만 다룬다. 나머지는 프로젝트가 3개 이상 쌓인 뒤 재검토한다.
      "필요해진 시점에 만든다"는 vaultos-health.md §5 원칙을 그대로 적용한 것이다.

  - id: DEC-002
    date: 2026-09-19
    owner: pm
    summary: solo-builder bootstrap을 선별 적용한다.
    context: >
      bootstrap을 복사본에 시험 실행한 결과 9개 → 29개 파일이 됐고, 신규 20개 중 10개가
      VaultOS Zone B(의도 계층)와 책임이 겹쳤다. solo-builder v0.1.0은 Zone A/B 분리 이전 설계다.
    consequence: >
      .codex/project-profile.env와 에이전트 진입점(AGENTS/CLAUDE/GEMINI.md)만 가져오고
      docs/ 의도 문서 7개와 agent 동기화 스크립트는 버렸다. 진입점 내용은 복사하지 않고
      VaultOS 경로를 가리키도록 새로 썼다. 상세는 VaultOS의 ADR-002.
    related_decisions: [ADR-002]
