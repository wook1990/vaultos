# 기기 등록 항목 — 08_DEVICES/README.md 참고
#
# 이 파일은 그 기기에서 뭘 하고 있는지의 세부 내용을 담지 않는다.
# "지금 이 기기가 있고, 뭘 하고 있으며, 온라인인가"만 요약한다.

device:
  id: DEV-KEY               # 대문자 하이픈. 예: DEV-WSL-MAIN
  name: 사람이 아는 이름      # 예: "메인 WSL 개발기"
  slug: device-slug         # 폴더명과 동일

workspace: personal          # personal | company — 08_DEVICES/personal 또는 company 폴더와 일치해야 한다

role: dev                    # dev | deploy | hybrid
# dev     개발 작업이 일어나는 곳 (성능에 맞는 프로젝트가 배정됨)
# deploy  배포된 제품이 실제로 떠 있는 곳 — 07_PRODUCTS와 연결됨
# hybrid  둘 다

capability: null             # 자유 텍스트. 예: "상시 온라인", "저사양 — 경량 작업만"

os: null                     # 자유 텍스트. 예: "WSL2 Ubuntu", "macOS"

workspace_root: null         # 이 기기의 02_WORKSPACES 로컬 경로

status:
  state: online               # online | offline | unknown
  last_seen: YYYY-MM-DD        # 사람이 세션 끝에 손으로 갱신

owner: null

# --- 필요해질 때만 채운다 ---

runs:
  agents: []                  # 예: [claude-code, codex-cli]. 이 기기에 로그인된 구독계정 하네스
  products: []                 # 07_PRODUCTS slug 참조. deploy 기기만 채움
